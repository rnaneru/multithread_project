server.port=8080
spring.application.name=vacancy-parser
spring.main.banner-mode=off

spring.datasource.url=jdbc:h2:mem:vacancies;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jackson.serialization.write-dates-as-timestamps=false

app.parser.rss-base-url=https://hh.ru/search/vacancy/rss
app.parser.vacancy-base-url=https://hh.ru/vacancy
app.parser.user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36
app.parser.default-query=Java
app.parser.default-area=1
app.parser.default-pages=1
app.parser.max-pages=10

app.parser.max-details=20
app.parser.detail-concurrency=4
app.parser.detail-delay-ms=100
app.parser.detail-mode=virtual

app.parser.request-timeout-ms=25000
app.parser.max-attempts=3

app.parser.executor-core-size=4
app.parser.executor-max-size=8
app.parser.executor-queue-capacity=200

app.parser.startup-pages=1
app.parser.schedule-pages=1
app.parser.startup-enabled=true
app.parser.schedule-enabled=true
app.parser.schedule-initial-delay-ms=900000
app.parser.schedule-delay-ms=1800000

app.parser.sync-timeout-ms=120000

logging.level.org.example.vacancyparser=INFO
logging.level.org.springframework.web.reactive.function.client=WARN
logging.level.reactor.netty=WARN
